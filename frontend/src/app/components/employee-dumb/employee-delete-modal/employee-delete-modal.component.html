@if (isOpen && employee) {
  <div class="modal-overlay" (click)="cancel.emit()">
    <div class="fluent-dialog" (click)="$event.stopPropagation()">
      <div class="dialog-header">
        <div class="dialog-icon-danger">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </div>
        <div class="dialog-titles">
          <h3 class="dialog-title">¿Eliminar colaborador?</h3>
          <p class="dialog-subtitle">Esta acción eliminará permanentemente al empleado de MongoDB.</p>
        </div>
      </div>

      <div class="dialog-body">
        <div class="employee-to-delete-card">
          <div class="del-name">{{ employee.nombre }}</div>
          <div class="del-cargo">{{ employee.cargo }} • {{ employee.departamento }}</div>
          <div class="del-id">ID: <code>{{ employee._id }}</code></div>
        </div>
      </div>

      <div class="dialog-footer">
        <button class="btn-cancel" (click)="cancel.emit()" [disabled]="isDeleting">Cancelar</button>
        <button class="btn-danger" (click)="onConfirm()" [disabled]="isDeleting">
          @if (isDeleting) {
            <span class="btn-spinner"></span>
            <span>Eliminando...</span>
          } @else {
            <span>Eliminar Registro</span>
          }
        </button>
      </div>
    </div>
  </div>
}
